[project]
name = "mail-triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail-triage = "mail_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mail_triage*"]

[tool.setuptools.package-data]
mail_triage = ["rules/data/*.txt"]
